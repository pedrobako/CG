<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Helicóptero</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <!-- ==================================================
             TÍTULO
        ================================================== -->

        <div>

            <h1>Helicopter</h1>

            <p class="subtitle">
                Controle de helicóptero em WebGL 2.0
            </p>

        </div>


        <!-- ==================================================
             CANVAS
        ================================================== -->

        <div class="canvas-container">

            <canvas
                id="canvas"
                width="600"
                height="600">
            </canvas>

        </div>


        <!-- ==================================================
             CONTROLES
        ================================================== -->

        <div class="control-panel">


            <!-- POLEGAR ESQUERDO -->

            <div class="control-group left">

                <button
                    id="btnLeft"
                    class="control-button"
                    type="button"
                    aria-label="Mover para esquerda">

                    ←

                </button>


                <button
                    id="btnDown"
                    class="control-button"
                    type="button"
                    aria-label="Mover para baixo">

                    ↓

                </button>

            </div>


            <!-- BOTÃO CENTRAL -->

            <button
                id="btnStart"
                class="start-button"
                type="button"
                aria-label="Ligar ou desligar helicóptero">

                <span class="power-icon"></span>

            </button>


            <!-- POLEGAR DIREITO -->

            <div class="control-group right">

                <button
                    id="btnUp"
                    class="control-button"
                    type="button"
                    aria-label="Mover para cima">

                    ↑

                </button>


                <button
                    id="btnRight"
                    class="control-button"
                    type="button"
                    aria-label="Mover para direita">

                    →

                </button>

            </div>

        </div>


        <!-- ==================================================
             RODAPÉ
        ================================================== -->

        <div class="footer">

            <strong>WebGL 2.0</strong><br>

            Use as setas para controlar o helicóptero
            e o botão central para ligar ou desligar.

        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="m4.js"></script>
    <script src="helicopterGeometry.js"></script>
    <script src="renderer.js"></script>
    <script src="sceneObject.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
