<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!--
        Fundamental para que o celular utilize
        a largura real da tela.
    -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Helicóptero</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body oncontextmenu="return false;">

    <div class="container">

        <!-- ==================================================
             TÍTULO
        ================================================== -->

        <h1>
            Helicóptero
        </h1>

        <p class="subtitle">
            Controle de helicóptero em WebGL 2.0
        </p>


        <!-- ==================================================
             CANVAS
        ================================================== -->

        <div class="canvas-container">

            <!--

                IMPORTANTE:

                A resolução interna continua sendo
                exatamente 600 x 600 pixels.

                O CSS controla somente a apresentação
                visual do canvas na tela.

            -->

            <canvas
                id="canvas"
                width="600"
                height="600"
                oncontextmenu="return false;">
            </canvas>

        </div>


        <!-- ==================================================
             CONTROLES
        ================================================== -->

        <div class="control-panel">


            <!-- ==================================================
                 CONTROLES ESQUERDOS
            ================================================== -->

            <div class="control-group left">

                <button
                    id="btnLeft"
                    class="control-button"
                    type="button"
                    aria-label="Mover para esquerda"
                    oncontextmenu="return false;">

                    ←

                </button>


                <button
                    id="btnDown"
                    class="control-button"
                    type="button"
                    aria-label="Mover para baixo"
                    oncontextmenu="return false;">

                    ↓

                </button>

            </div>


            <!-- ==================================================
                 BOTÃO LIGAR / DESLIGAR
            ================================================== -->

            <button
                id="btnStart"
                class="start-button"
                type="button"
                aria-label="Ligar ou desligar helicóptero"
                oncontextmenu="return false;">

                <span class="power-icon"></span>

            </button>


            <!-- ==================================================
                 CONTROLES DIREITOS
            ================================================== -->

            <div class="control-group right">

                <button
                    id="btnUp"
                    class="control-button"
                    type="button"
                    aria-label="Mover para cima"
                    oncontextmenu="return false;">

                    ↑

                </button>


                <button
                    id="btnRight"
                    class="control-button"
                    type="button"
                    aria-label="Mover para direita"
                    oncontextmenu="return false;">

                    →

                </button>

            </div>

        </div>


        <!-- ==================================================
             RODAPÉ
        ================================================== -->

        <div class="footer">

            <strong>WebGL 2.0</strong>

            <br>

            Use as setas para controlar o helicóptero
            e o botão central para ligar ou desligar.

        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="m4.js"></script>

    <script src="helicopterGeometry.js"></script>

    <script src="renderer.js"></script>

    <script src="sceneObject.js"></script>

    <script src="scene.js"></script>

    <script src="main.js"></script>

</body>

</html>
