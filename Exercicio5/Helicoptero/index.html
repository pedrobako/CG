<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Helicopter</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #26364d,
                    #111827 55%,
                    #080c14
                );

            color: white;
        }


        /* ==================================================
           CONTAINER PRINCIPAL
        ================================================== */

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 20px;

            padding: 30px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(10px);
        }


        /* ==================================================
           TÍTULO
        ================================================== */

        h1 {
            margin: 0;

            font-size: 28px;

            letter-spacing: 1px;
        }

        .subtitle {
            margin: 5px 0 0;

            color: #aeb9c9;

            font-size: 14px;

            text-align: center;
        }


        /* ==================================================
           CANVAS
        ================================================== */

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;

            background: #080c14;

            border-radius: 14px;

            box-shadow:
                inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;

            width: 600px;
            height: 600px;

            max-width: 100%;

            border-radius: 8px;
        }


        /* ==================================================
           PAINEL DOS CONTROLES
        ================================================== */

        .control-panel {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            column-gap: 25px;
        }


        /* ==================================================
           CONTROLES ESQUERDA / DIREITA
        ================================================== */

        .control-group {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        .control-group.left {
            justify-content: flex-start;
        }

        .control-group.right {
            justify-content: flex-end;
        }


        /* ==================================================
           BOTÕES DE MOVIMENTO
        ================================================== */

        .control-button {
            width: 64px;
            height: 64px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;

            border: 1px solid #475569;

            border-radius: 12px;

            background: #1e293b;

            color: white;

            font-size: 30px;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: none;

            box-shadow:
                0 4px 0 #0f172a;

            transition:
                transform 0.05s,
                background 0.1s;
        }

        .control-button:hover {
            background: #334155;
        }

        .control-button:active {
            transform: translateY(4px);

            box-shadow:
                0 0 0 #0f172a;

            background: #475569;
        }


        /* ==================================================
           BOTÃO LIGAR / DESLIGAR
        ================================================== */

        .start-button {
            width: 82px;
            height: 82px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;

            border: 1px solid #475569;

            border-radius: 50%;

            background: #1e293b;

            color: #7dd3fc;

            font-size: 34px;

            cursor: pointer;

            user-select: none;
            -webkit-user-select: none;

            touch-action: none;

            box-shadow:
                0 4px 0 #0f172a;

            transition:
                transform 0.05s,
                background 0.1s;
        }

        .start-button:hover {
            background: #334155;
        }

        .start-button:active {
            transform: translateY(4px);

            box-shadow:
                0 0 0 #0f172a;

            background: #475569;
        }


        /* ==================================================
           RODAPÉ
        ================================================== */

        .footer {
            width: 100%;

            padding-top: 15px;

            border-top:
                1px solid rgba(255, 255, 255, 0.1);

            color: #64748b;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        /* ==================================================
           CELULAR
        ================================================== */

        @media (max-width: 650px) {

            body {
                align-items: flex-start;
            }

            .container {
                width: 100%;

                min-height: 100vh;

                padding:
                    15px
                    10px
                    20px;

                border-radius: 0;

                gap: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 12px;
            }

            .canvas-container {
                width: 100%;

                padding: 8px;
            }

            canvas {
                width: 100%;
                height: auto;
            }


            /* Controles ocupam toda a largura */

            .control-panel {
                width: 100%;

                column-gap: 8px;
            }


            .control-group {
                gap: 6px;
            }

            .control-button {
                width: 58px;
                height: 58px;

                font-size: 26px;
            }

            .start-button {
                width: 72px;
                height: 72px;

                font-size: 30px;
            }

            .footer {
                font-size: 11px;
            }
        }


        /* ==================================================
           CELULARES PEQUENOS
        ================================================== */

        @media (max-width: 400px) {

            .container {
                padding-left: 6px;
                padding-right: 6px;
            }

            .control-group {
                gap: 4px;
            }

            .control-button {
                width: 52px;
                height: 52px;

                font-size: 23px;
            }

            .start-button {
                width: 64px;
                height: 64px;

                font-size: 27px;
            }
        }

    </style>

</head>


<body>

    <div class="container">


        <!-- ==================================================
             TÍTULO
        ================================================== -->

        <div>

            <h1>Helicopter</h1>

            <p class="subtitle">
                Controle de helicóptero em WebGL 2.0
            </p>

        </div>


        <!-- ==================================================
             CANVAS
        ================================================== -->

        <div class="canvas-container">

            <canvas
                id="canvas"
                width="600"
                height="600">
            </canvas>

        </div>


        <!-- ==================================================
             CONTROLES
        ================================================== -->

        <div class="control-panel">


            <!-- ==============================================
                 POLEGAR ESQUERDO
            =============================================== -->

            <div class="control-group left">

                <button
                    id="btnLeft"
                    class="control-button">
                    ←
                </button>

                <button
                    id="btnDown"
                    class="control-button">
                    ↓
                </button>

            </div>


            <!-- ==============================================
                 BOTÃO CENTRAL
            =============================================== -->

            <button
                id="btnStart"
                class="start-button">
                ⏻
            </button>


            <!-- ==============================================
                 POLEGAR DIREITO
            =============================================== -->

            <div class="control-group right">

                <button
                    id="btnUp"
                    class="control-button">
                    ↑
                </button>

                <button
                    id="btnRight"
                    class="control-button">
                    →
                </button>

            </div>

        </div>


        <!-- ==================================================
             RODAPÉ
        ================================================== -->

        <div class="footer">

            <strong>WebGL 2.0</strong><br>

            Use as setas para controlar o helicóptero
            e ⏻ para ligar ou desligar.

        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="m4.js"></script>
    <script src="helicopterGeometry.js"></script>
    <script src="renderer.js"></script>
    <script src="sceneObject.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
