<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro 3D</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <main class="game-container">

        <!-- Área do jogo -->
        <section class="game-area">
            <canvas id="canvas" width="800" height="600"></canvas>
        </section>

        <!-- Painel de controles -->
        <aside class="controls-area">
            <div class="keypad">

                <!-- Primeira linha -->
                <div class="key" data-key="Numpad7">
                    7
                    <span class="key-label">Sun -</span>
                </div>

                <div class="key" data-key="Numpad8">
                    8
                    <span class="key-label">camera up</span>
                </div>

                <div class="key" data-key="Numpad9">
                    9
                    <span class="key-label">Sun +</span>
                </div>

                <div class="key" data-key="Minus">
                    -
                    <span class="key-label">Amb -</span>
                </div>

                <!-- Segunda linha -->
                <div class="key" data-key="Numpad4">
                    4
                    <span class="key-label">camera left</span>
                </div>

                <div class="key" data-key="Numpad5">
                    5
                    <span class="key-label">focus car</span>
                </div>

                <div class="key" data-key="Numpad6">
                    6
                    <span class="key-label">camera right</span>
                </div>

                <div class="key" data-key="NumpadAdd">
                    +
                    <span class="key-label">Amb +</span>
                </div>

                <!-- Terceira linha -->
                <div class="key" data-key="Numpad1">
                    1
                    <span class="key-label">1st person</span>
                </div>

                <div class="key" data-key="Numpad2">
                    2
                    <span class="key-label">camera down</span>
                </div>

                <div class="key" data-key="Numpad3">
                    3
                    <span class="key-label">3rd person</span>
                </div>

                <div class="key" data-key="NumpadEnter">
                    ↵
                    <span class="key-label">Day / Night</span>
                </div>

            </div>
        </aside>

    </main>

    <!-- Scripts do projeto -->
    <script src="constants.js"></script>
    <script src="m4.js"></script>
    <script src="addNormalsToGeometry.js"></script>
    <script src="floorGeometry.js"></script>
    <script src="raceTrackGeometry.js"></script>
    <script src="skyGeometry.js"></script>
    <script src="gltfLoader.js"></script>
    <script src="renderer.js"></script>
    <script src="sceneObject.js"></script>
    <script src="camera.js"></script>
    <script src="controls.js"></script>
    <script src="lights.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
