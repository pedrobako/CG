<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enduro 3D</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <main class="game-container">

        <!-- Área do jogo -->
        <section class="game-area">

            <canvas id="canvas" width="800" height="600"></canvas>

            <!-- Controles do carro: lado esquerdo -->
            <div class="driving-controls driving-controls-left">

                <button class="driving-button" data-key="ArrowDown" type="button">
                    <span class="button-icon">▼</span>
                    <span class="button-label">Freio</span>
                </button>

                <button class="driving-button" data-key="ArrowLeft" type="button">
                    <span class="button-icon">◀</span>
                    <span class="button-label">Esquerda</span>
                </button>

            </div>

            <!-- Controles do carro: lado direito -->
            <div class="driving-controls driving-controls-right">

                <button class="driving-button" data-key="Space" type="button">
                    <span class="button-icon">▲</span>
                    <span class="button-label">Acelerar</span>
                </button>

                <button class="driving-button" data-key="ArrowRight" type="button">
                    <span class="button-icon">▶</span>
                    <span class="button-label">Direita</span>
                </button>

            </div>

            <!-- HUD: Painel de pontuação -->
            <div id="game-hud">

                <div id="score-panel">

                    <!-- Distância percorrida -->
                    <div id="distance">000000</div>

                    <!-- Level -->
                    <div id="level">1</div>

                    <!-- Carros restantes -->
                    <div id="cars-remaining">

                        <img src="textures/car-icon.png" alt="Cars remaining" class="car-icon">

                        <span id="cars-count">200</span>

                    </div>

                </div>

            </div>

        </section>

        <!-- Painel de controles -->
        <aside class="controls-area">

            <div class="keypad">

                <!-- Primeira linha -->
                <div class="key" data-key="Numpad7">
                    7
                    <span class="key-label">Sun -</span>
                </div>

                <div class="key" data-key="Numpad8">
                    8
                    <span class="key-label">Camera up</span>
                </div>

                <div class="key" data-key="Numpad9">
                    9
                    <span class="key-label">Sun +</span>
                </div>

                <div class="key" data-key="Minus">
                    -
                    <span class="key-label">Amb -</span>
                </div>

                <!-- Segunda linha -->
                <div class="key" data-key="Numpad4">
                    4
                    <span class="key-label">Camera left</span>
                </div>

                <div class="key" data-key="Numpad5">
                    5
                    <span class="key-label">Focus car</span>
                </div>

                <div class="key" data-key="Numpad6">
                    6
                    <span class="key-label">Camera right</span>
                </div>

                <div class="key" data-key="NumpadAdd">
                    +
                    <span class="key-label">Amb +</span>
                </div>

                <!-- Terceira linha -->
                <div class="key" data-key="Numpad1">
                    1
                    <span class="key-label">1st person</span>
                </div>

                <div class="key" data-key="Numpad2">
                    2
                    <span class="key-label">Camera down</span>
                </div>

                <div class="key" data-key="Numpad3">
                    3
                    <span class="key-label">3rd person</span>
                </div>

                <div class="key" data-key="NumpadEnter">
                    ↵
                    <span class="key-label">Day / Night</span>
                </div>

                <!-- Quarta linha -->
                <div class="key" data-key="KeyP">
                    P
                    <span class="key-label">Pause</span>
                </div>

                <div class="key" data-key="KeyD">
                    D
                    <span class="key-label">Demo</span>
                </div>

                <div class="key" data-key="KeyT">
                    T
                    <span class="key-label">Track</span>
                </div>

                <div class="key empty"></div>

            </div>

        </aside>

    </main>

    <!-- Scripts do projeto -->
    <script src="constants.js"></script>
    <script src="m4.js"></script>
    <script src="geometries/functionsToGeometry.js"></script>
    <script src="geometries/floorGeometry.js"></script>
    <script src="geometries/raceTrackGeometry.js"></script>
    <script src="geometries/carAreaGeometry.js"></script>
    <script src="geometries/skyGeometry.js"></script>
    <script src="geometries/moonGeometry.js"></script>
    <script src="geometries/billboardGeometry.js"></script>
    <script src="gltfLoader.js"></script>
    <script src="renderer.js"></script>
    <script src="sceneObject.js"></script>
    <script src="enduroCar.js"></script>
    <script src="camera.js"></script>
    <script src="controls.js"></script>
    <script src="lights.js"></script>
    <script src="collisions.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
